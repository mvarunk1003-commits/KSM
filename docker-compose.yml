# =============================================================================
# Kolar Sringeri SriShankara Mutt — Multi-Container Docker Stack
# Backend API + PostgreSQL 16 + pgAdmin 4
# Target Host: AWS EC2 Asia Pacific (ap-south-1 Mumbai)
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Express Backend API Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ksm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ksm_temple_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSL=${DB_SSL:-false}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID:-}
    volumes:
      - ./backend/data:/app/data
      - ./frontend/public/assets:/app/public/assets
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ksm-network

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ksm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ksm_temple_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ksm_temple_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ksm-network

  # ---------------------------------------------------------------------------
  # 3. pgAdmin 4 Web GUI Dashboard
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ksm-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-AdminPassword123!}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ksm-network

  # ---------------------------------------------------------------------------
  # 4. React Frontend Web Application (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ksm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ksm-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ksm-network:
    driver: bridge
